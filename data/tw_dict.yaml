# 台灣用語替換詞表
# 格式: "來源詞": "替換詞"
# OpenCC s2twp 已涵蓋大部分，這裡補充它沒蓋到的

# --- OpenCC 過度轉換修正 ---
# OpenCC 會把某些台灣常用詞轉成較少用的異體，這裡修正回來
"平臺": "平台"

# --- 同音異字修正 ---
# Whisper 有時選了簡體慣用的同音字，這裡修正為台灣慣用寫法
"人工智能": "人工智慧"
"代碼": "程式碼"
"調用": "呼叫"
"博客": "部落格"
"交互": "互動"
"鏈接": "連結"
"默認": "預設"
"激活": "啟用"
"插件": "外掛"
"控件": "控制項"
"打印": "列印"
"高清": "高畫質"
"字節": "位元組"
"比特": "位元"

# --- 自行新增 ---
"優化": "改善"
"代辦事項": "待辦事項"
"三節號": "刪節號"

# --- ASR 同音誤辨識修正 ---
"辦形": "半形"
"轉入": "轉錄"
"以有": "已有"

# 「外餐」在目前使用情境中可確定是「外參」的誤辨識，直接做單詞替換。
"外餐": "外參"

# 「表點」仍只替換實際出現過的完整詞組，避免誤傷「報表點選」等正常用法。
"手動的表點": "手動的標點"
"手動表點": "手動標點"
"空間的坐表點": "空間的座標點"
