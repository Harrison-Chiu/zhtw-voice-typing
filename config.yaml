# ASR Input 設定檔

asr:
  engine: whisper       # 可選: qwen, whisper

  # --- whisper (faster-whisper) ---
  # initial_prompt 會真的引導輸出字體與標點：短繁體句+全形標點 → 原生繁體+標點
  model_id: "large-v3-turbo"
  device: cuda
  compute_type: float16
  language: "zh"
  initial_prompt: "繁體中文，台灣用語。"
  beam_size: 5

  # --- qwen (備用，context 對簡繁無效，僅靠後處理) ---
  # model_id: "Qwen/Qwen3-ASR-1.7B"
  # language: "Chinese"
  # context: ""

audio:
  sample_rate: 16000

processing:
  opencc_config: s2twp   # 簡體→台灣繁體（含慣用詞轉換）
  tw_dict_path: data/tw_dict.yaml

output:
  method: clipboard      # 可選: clipboard, keyboard (未來擴展)

hotkey:
  combination: "ctrl+alt+space"   # 全域錄音切換快捷鍵
