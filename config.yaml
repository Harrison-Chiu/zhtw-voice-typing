# ASR Input 設定檔

asr:
  engine: whisper       # 可選: qwen, whisper

  # --- whisper (faster-whisper) ---
  # initial_prompt 會真的引導輸出字體與標點：短繁體句+全形標點 → 原生繁體+標點
  model_id: "large-v3-turbo"
  device: cuda
  compute_type: float16
  language: "zh"
  initial_prompt: "繁體中文，台灣用語。"
  hotwords: "詞表 待辦 清單 聲學 標點 主分支"
  beam_size: 5

  # --- qwen (備用，context 對簡繁無效，僅靠後處理) ---
  # model_id: "Qwen/Qwen3-ASR-1.7B"
  # language: "Chinese"
  # context: ""

vad:
  enabled: true
  threshold: 0.5                # VAD 信心門檻（0-1，越高越嚴格）
  min_speech_duration_ms: 250   # 最短語音段（ms）
  min_silence_duration_ms: 800  # 靜音多久切段（ms）
  speech_pad_ms: 100            # 語音段前後留白（ms）
  max_segment_sec: 60.0         # 單段上限（秒），超過會用更短靜音門檻再切
  fallback_silence_ms: [500, 300]  # 長段遞減嘗試的靜音門檻
  min_audio_len_sec: 30.0       # 低於此秒數不切段，直接辨識

audio:
  sample_rate: 16000

processing:
  opencc_config: s2twp   # 簡體→台灣繁體（含慣用詞轉換）
  tw_dict_path: data/tw_dict.yaml

output:
  method: clipboard      # 可選: clipboard, keyboard (未來擴展)

streaming:
  silence_trigger_ms: 1000   # 靜音多久觸發切句辨識（ms），建議 800-1200
  max_segment_sec: 30.0      # 單段最長秒數，超過強制切句（安全網）
  min_energy: 0.005          # RMS 能量門檻，低於此值的段不送辨識（防幻覺/誤觸）
  adaptive_thresholds:       # 語音累積越長，靜音門檻越短（優先找自然斷點）
    - { after_sec: 15, silence_ms: 800 }
    - { after_sec: 20, silence_ms: 500 }
    - { after_sec: 25, silence_ms: 300 }

hotkey:
  combination: "ctrl+shift+space"   # 全域錄音切換快捷鍵
