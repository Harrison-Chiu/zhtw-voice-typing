# ASR Input 設定檔

asr:
  engine: whisper       # 可選: qwen, whisper

  # --- whisper (faster-whisper) ---
  # initial_prompt 會真的引導輸出字體與標點：短繁體句+全形標點 → 原生繁體+標點
  model_id: "large-v3-turbo"
  device: cuda
  compute_type: float16
  language: "zh"
  initial_prompt: "使用繁體中文，台灣用語。"
  hotwords: "詞表 待辦 清單 聲學 標點 主分支 逗號"
  beam_size: 5

  # --- qwen (備用，context 對簡繁無效，僅靠後處理) ---
  # model_id: "Qwen/Qwen3-ASR-1.7B"
  # language: "Chinese"
  # context: ""

vad:
  enabled: true
  threshold: 0.5                # VAD 信心門檻（0-1，越高越嚴格）
  min_speech_duration_ms: 250   # 最短語音段（ms）
  min_silence_duration_ms: 800  # 靜音多久切段（ms）
  speech_pad_ms: 100            # 語音段前後留白（ms）
  max_segment_sec: 60.0         # 單段上限（秒），超過會用更短靜音門檻再切
  fallback_silence_ms: [500, 300]  # 長段遞減嘗試的靜音門檻
  min_audio_len_sec: 30.0       # 低於此秒數不切段，直接辨識

audio:
  sample_rate: 16000

processing:
  opencc_config: s2twp   # 簡體→台灣繁體（含慣用詞轉換）
  tw_dict_path: data/tw_dict.yaml

output:
  method: clipboard      # 可選: clipboard, keyboard (未來擴展)

streaming:
  silence_trigger_ms: 1000   # 起點：靜音多久觸發切句（ms）
  silence_min_ms: 300        # 終點：語音累積夠長時的最短靜音門檻（ms）
  ramp_start_sec: 10.0       # 幾秒後開始遞減（之前固定用 silence_trigger_ms）
  ramp_end_sec: 25.0         # 幾秒時到達 silence_min_ms（之後固定用 silence_min_ms）
  max_segment_sec: 30.0      # 單段最長秒數，超過強制切句（安全網）
  min_energy: 0.005          # RMS 能量門檻，低於此值的段不送辨識（防幻覺/誤觸）
  hallucination_threshold_sec: 1.5  # 轉錄時間超過此值判定為疑似幻覺
  min_hallucination_audio_sec: 3.0  # 音訊短於此秒數不啟動幻覺偵測（避免短句誤判）
  fallback_silence_ms: [500, 300]   # fallback 重切範圍 [起點, 底線]，每 100ms 遞減尋找最小切分
  fallback_rms_target: 0.05         # 幻覺 fallback 第一步：RMS 正規化目標值（正常語音 ~0.03-0.1）
  verbose: true              # CLI 顯示 VAD 切句、辨識時間等詳細資訊

hotkey:
  combination: "ctrl+shift+space"   # 全域錄音切換快捷鍵
