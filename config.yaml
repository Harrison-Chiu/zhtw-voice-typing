# ASR Input 設定檔

asr:
  engine: whisper       # 可選: qwen, whisper

  # --- whisper (faster-whisper) ---
  # initial_prompt 會真的引導輸出字體與標點：短繁體句+全形標點 → 原生繁體+標點
  model_id: "large-v3-turbo"
  device: cuda
  compute_type: float16
  language: "zh"
  initial_prompt: "使用繁體中文，台灣用語。"
  hotwords: "詞表 待辦 清單 聲學 標點 主分支 逗號"
  beam_size: 5

  # --- qwen (備用，context 對簡繁無效，僅靠後處理) ---
  # model_id: "Qwen/Qwen3-ASR-1.7B"
  # language: "Chinese"
  # context: ""

  # --- OpenRouter（雲端實驗引擎；目前停用，不要把 API key 寫進本檔）---
  # engine: openrouter
  # model_id: "qwen/qwen3-asr-flash-2026-02-10"
  # language: "zh"
  # timeout_sec: 45
  # api_key_env: "OPENROUTER_API_KEY"
  # credential_service: "asr-input/openrouter"
  # credential_username: "api-key"
  # zdr: true

vad:
  enabled: true
  threshold: 0.5                # VAD 信心門檻（0-1，越高越嚴格）
  min_speech_duration_ms: 250   # 最短語音段（ms）
  min_silence_duration_ms: 800  # 靜音多久切段（ms）
  speech_pad_ms: 100            # 語音段前後留白（ms）
  max_segment_sec: 60.0         # 單段上限（秒），超過會用更短靜音門檻再切
  fallback_silence_ms: [500, 300]  # 長段遞減嘗試的靜音門檻
  min_audio_len_sec: 30.0       # 低於此秒數不切段，直接辨識

audio:
  sample_rate: 16000

microphone:
  # hypothesis：需以安靜、Windows 靜音、拔除／停用裝置實測後再調整。
  near_zero_rms: 0.0001
  near_zero_warning_sec: 5.0

processing:
  # 語音輸入預設只轉字形，保留使用者實際說出的「接口／設備」等詞。
  opencc_config: s2t     # 簡體→繁體字形，不改寫地區詞彙
  localize_tw_terms: false # true 才套用 data/tw_dict.yaml 的台灣詞彙／已知修正
  tw_dict_path: data/tw_dict.yaml

output:
  method: clipboard      # 可選: clipboard, keyboard (未來擴展)

streaming:
  silence_trigger_ms: 1000   # 起點：靜音多久觸發切句（ms）
  silence_min_ms: 300        # 終點：語音累積夠長時的最短靜音門檻（ms）
  ramp_start_sec: 10.0       # 幾秒後開始遞減（之前固定用 silence_trigger_ms）
  ramp_end_sec: 25.0         # 幾秒時到達 silence_min_ms（之後固定用 silence_min_ms）
  max_segment_sec: 30.0      # 單段最長秒數，超過強制切句（安全網）
  min_energy: 0.005          # RMS 能量門檻，低於此值的段不送辨識（防幻覺/誤觸）
  hallucination_threshold_sec: 1.5  # 轉錄時間超過此值判定為疑似幻覺
  min_hallucination_audio_sec: 3.0  # 歷史門檻；已知會漏極短異常，保留待固定回歸集重驗
  fallback_silence_ms: [500, 300]   # fallback 重切範圍 [起點, 底線]，每 100ms 遞減尋找最小切分
  fallback_rms_target: 0.05         # 幻覺 fallback 第一步：RMS 正規化目標值（正常語音 ~0.03-0.1）
  verbose: true              # CLI 顯示 VAD 切句、辨識時間等詳細資訊

logging:
  mode: full        # off / errors / full；目前個人開發環境保留完整診斷資料
  max_audio_gib: 2 # 淘汰 rolling pool 最舊音訊；metadata 與已升格 corpus 不刪

recovery:
  enabled: true     # 異常關閉後復原尚未辨識完成的錄音；成功後依 logging.mode 清理音訊

history:
  recent_results_enabled: true # 文字型安全網，與完整診斷 log／Windows 剪貼簿歷程無關
  recent_results_limit: 20
  tray_recent_limit: 5

hotkey:
  combination: "ctrl+shift+space"   # 全域錄音切換快捷鍵

lifecycle:
  idle_unload_minutes: 30   # 無錄音、排隊工作或辨識時，多久後自動釋放 ASR 模型

startup:
  # PyTorch CUDA 暖機：啟動時 torch.zeros(1).to(cuda) 觸發 CUDA context 初始化。
  # 預設關閉（空轉）：目前 ASR 走 CTranslate2（非 PyTorch）、Silero VAD 跑 CPU，
  # 進程內沒有任何 PyTorch GPU 工作會用到這個 context，暖機是純空轉（實測 ~0.1s，
  # 無害但無益）。保留開關給未來：若改用 PyTorch-based ASR 引擎、或讓 VAD 上 GPU，
  # 開啟可把「首次 CUDA 初始化」提前到啟動階段，縮短首次推論延遲。
  cuda_warmup: false
