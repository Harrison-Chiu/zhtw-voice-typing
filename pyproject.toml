[project]
name = "asr-input"
version = "0.1.0"
description = "Local ASR input system for Traditional Chinese (Taiwan)"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "onnxruntime>=1.20",
    "opencc-python-reimplemented>=0.1.7",
    "pyyaml>=6.0.3",
    "qwen-asr>=0.0.6",
    "silero-vad>=5.1",
    "sounddevice>=0.5.5",
    "torch>=2.6.0",
    "torchaudio>=2.6.0",
    "pynput>=1.8.1",
    "pystray>=0.19.5",
    "Pillow>=11.0.0",
    "soundfile>=0.13.1",
    "keyring>=25.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_input"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
extend-exclude = ["scripts/build_log_viewer.py"]

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
# 內嵌 HTML/CSS/JS 模板的長行不折（折了反而難讀），Python 部分照常檢查。
"scripts/build_review_queue.py" = ["E501"]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.17",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
# CUDA wheels only exist for Windows/Linux. macOS has no pytorch-cu124 build, so the
# marker keeps `uv sync` from failing there and lets it fall back to PyPI wheels.
torch = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
torchaudio = { index = "pytorch-cu124", marker = "sys_platform != 'darwin'" }
