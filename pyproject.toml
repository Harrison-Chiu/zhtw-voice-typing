[project]
name = "asr-input"
version = "0.1.0"
description = "Local ASR input system for Traditional Chinese (Taiwan)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.6",
    "opencc-python-reimplemented>=0.1.7",
    "pyyaml>=6.0.3",
    "sounddevice>=0.5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_input"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]
